name: Build Archer AX80v1 images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag, e.g. r36350-archer-ax80-v1"
        required: true
        type: string
  push:
    tags:
      - 'r*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/lib/jvm /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget zstd

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          # The key is unique per commit so every run saves a fresh cache;
          # restore-keys then picks the most recent one on the next run.
          key: ccache-mediatek-filogic-${{ github.sha }}
          restore-keys: |
            ccache-mediatek-filogic-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Download prebuilt toolchain
        run: |
          # OpenWrt publishes a toolchain per target; using it skips the
          # tools/ and toolchain/ build stages, which dominate the runtime.
          BASE="https://downloads.cdn.openwrt.org/snapshots/targets/mediatek/filogic"
          TOOLCHAIN_FILE="$(curl -sSf "$BASE/sha256sums" | grep -oE 'openwrt-toolchain[^ ]*\.tar\.zst' | head -n1)"
          if [ -z "$TOOLCHAIN_FILE" ]; then
            echo "No prebuilt toolchain published for this target" >&2
            exit 1
          fi
          echo "Using $TOOLCHAIN_FILE"
          curl -sSfLO "$BASE/$TOOLCHAIN_FILE"
          tar --zstd -xf "$TOOLCHAIN_FILE"
          echo "TOOLCHAIN_DIR=${TOOLCHAIN_FILE%.tar.zst}" >> "$GITHUB_ENV"

      - name: Write build configuration
        run: |
          # ext-toolchain.sh appends the toolchain settings to .config and then
          # runs "make defconfig" itself. That first defconfig pins the package
          # defaults of whichever profile is active into .config, and a later
          # profile switch does not revisit them (profile packages are Kconfig
          # defaults, not selects). With no device chosen it would pin the
          # target's DEFAULT_PROFILE (openwrt_one), so the device is selected
          # before the script runs.
          echo 'CONFIG_TARGET_mediatek_filogic_DEVICE_tplink_archer-ax80-v1-ubi=y' > .config
          ./scripts/ext-toolchain.sh \
            --toolchain "$TOOLCHAIN_DIR"/toolchain-* \
            --overwrite-config \
            --config mediatek/filogic

          # CONFIG_IB depends on "!EXTERNAL_TOOLCHAIN || EXTERNAL_TOOLCHAIN_IB",
          # so the Image Builder needs EXTERNAL_TOOLCHAIN_IB here, and that
          # option is only selectable with DEVEL set.
          # IMAGEOPT and VERSIONOPT must be set for VERSION_NUMBER to take effect.
          # VERSION_CODE_FILENAMES is disabled so the git revision stays out of
          # the image filenames; the installer builds the names it downloads from
          # the version alone and would not find them otherwise. The release tag
          # and CONFIG_VERSION_NUMBER must therefore stay identical.
          cat >> .config <<EOF
          CONFIG_DEVEL=y
          CONFIG_AUTOREMOVE=y
          CONFIG_CCACHE=y
          CONFIG_EXTERNAL_TOOLCHAIN_IB=y
          CONFIG_IMAGEOPT=y
          CONFIG_VERSIONOPT=y
          CONFIG_VERSION_NUMBER="${RELEASE_TAG}"
          CONFIG_IB=y
          # CONFIG_VERSION_CODE_FILENAMES is not set
          EOF
          make defconfig

          # Fail early and loudly if the prebuilt toolchain did not take effect,
          # rather than silently spending an hour rebuilding it.
          grep -q '^CONFIG_EXTERNAL_TOOLCHAIN=y' .config || {
            echo "external toolchain was not configured" >&2
            exit 1
          }
          grep -q '^CONFIG_CCACHE=y' .config || {
            echo "ccache was not configured" >&2
            exit 1
          }

          # Likewise verify that the device profile and every package it lists
          # actually made it into .config, otherwise the images build without
          # Wi-Fi firmware and LED support and only the installer notices.
          PROFILE="DEVICE_tplink_archer-ax80-v1-ubi"
          grep -q "^CONFIG_TARGET_PROFILE=\"${PROFILE}\"" .config || {
            echo "device profile ${PROFILE} was not selected" >&2
            exit 1
          }
          for pkg in $(sed -n "/^Target-Profile: ${PROFILE}\$/,/^@@/s/^Target-Profile-Packages: //p" tmp/.targetinfo); do
            grep -q "^CONFIG_PACKAGE_${pkg}=y" .config || {
              echo "device package ${pkg} was not selected" >&2
              exit 1
            }
          done

      - name: Build
        run: make -j$(nproc) || make -j1 V=sc

      - name: Show ccache statistics
        if: always()
        run: CCACHE_DIR="$PWD/.ccache" staging_dir/host/bin/ccache --show-stats || true

      # Save even after a failed build so the objects compiled so far are not
      # lost; the plain actions/cache post step only saves on success.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-mediatek-filogic-${{ github.sha }}

      - name: Collect release assets
        run: |
          mkdir -p release
          BIN="bin/targets/mediatek/filogic"
          cp "$BIN/openwrt-${RELEASE_TAG}-mediatek-filogic-tplink_archer-ax80-v1-ubi-initramfs-recovery.itb" release/
          cp "$BIN/openwrt-${RELEASE_TAG}-mediatek-filogic-tplink_archer-ax80-v1-ubi-squashfs-sysupgrade.itb" release/
          cp "$BIN/openwrt-${RELEASE_TAG}-mediatek-filogic-tplink_archer-ax80-v1-ubi-preloader.bin" release/
          cp "$BIN/openwrt-${RELEASE_TAG}-mediatek-filogic-tplink_archer-ax80-v1-ubi-bl31-uboot.fip" release/
          cp "$BIN/openwrt-imagebuilder-${RELEASE_TAG}-mediatek-filogic.Linux-x86_64.tar.zst" release/

      - name: Generate sha256sums
        run: |
          # The manifest is written outside the directory first so it cannot include itself.
          cd release
          rm -f sha256sums sha256sums.asc
          sha256sum -- * > ../sha256sums.tmp
          mv ../sha256sums.tmp sha256sums

      - name: Sign the manifest
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # The installer verifies this signature before trusting any checksum.
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes \
            --pinentry-mode loopback --passphrase-fd 0 \
            --local-user 0xE45257FFB6039696 \
            --detach-sign --armor release/sha256sums

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Make resilient to release already existing.
          gh release create "${RELEASE_TAG}" --title "${RELEASE_TAG}" --notes "OpenWrt build for Archer AX80v1" || true
          gh release upload "${RELEASE_TAG}" release/* --clobber
